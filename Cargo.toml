[workspace]
members = ["bin/*", "crates/*"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
# reth, from our fork at github.com/Arkiv-Network/reth rather than upstream.
# `arkiv/custom-golemdb` is the long-lived Arkiv line: it carries the seams that
# let the engine run on a provider of our own, keep its chain outside reth's
# database, and anchor the overlays on frontiers we supply.
#
# The fork is public, so cargo fetches it over HTTPS with no credentials.
#
# Docker builds the workspace in isolation, so reth must be a git dependency.
# Default features are off: v2.5.0 added "jit" to reth's defaults, which pulls
# revmc -> llvm-sys and needs a system LLVM 22 that neither the dev machines nor
# the slim Docker builder has. We only use `reth::cli::Cli`, so nothing else in
# that default set is required — except "asm-keccak" (assembly keccak256 on the
# state-root/tx-hash hot path) and "jemalloc".
reth = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0", default-features = false, features = [
    "asm-keccak",
    "jemalloc",
] }
reth-ethereum-cli = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
# The `ChainSpecParser` trait behind `--chain`; arkiv-reth-chainspec implements it.
reth-cli = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
# `NodeRecord`, the bootnode type in the `EthChainSpec` trait the Arkiv chain spec implements.
reth-network-peers = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
# The jemalloc allocator itself. `reth`'s "jemalloc" feature only wires up the
# jemalloc *stats* reporting in node-core/metrics/provider; the allocator has to
# be declared as `#[global_allocator]` by the binary, which is what reth's own
# main.rs does. `reth` doesn't re-export it, so we depend on it directly.
reth-cli-util = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0", features = [
    "jemalloc",
] }
reth-node-ethereum = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
# Umbrella crate used by the executor seam (matches the custom-evm example's deps).
# Keep default features (std); the executor crate adds "evm" + "node".
reth-ethereum = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
# Read-side state access for the arkiv_* RPC (the StateProvider snapshot).
reth-storage-api = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
# The provider stack `ArkivProvider` delegates to while it is still reth's.
reth-provider = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-chain-state = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-node-types = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-primitives-traits = { version = "0.8.1", default-features = false }
# Named in `RocksDBProviderFactory`'s signature; same version reth pins.
rocksdb = "0.24"
reth-node-builder = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-db = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-db-api = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-execution-types = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-prune-types = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-stages-types = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-static-file-types = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-storage-errors = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-chainspec = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-trie = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
# Re-exports revm, for the `BundleState` that `HashedPostStateProvider` names.
reth-revm = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
# The engine-tree state-root seam: the header carries GolemDB's root, not an MPT root.
reth-engine-tree = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-evm = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-node-api = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-ethereum-primitives = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-storage-overlay = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
arkiv-reth-golemdbprovider = { path = "crates/arkiv-reth-golemdbprovider" }
reth-basic-payload-builder = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-ethereum-payload-builder = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-payload-builder = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }
reth-payload-builder-primitives = { git = "https://github.com/Arkiv-Network/reth", tag = "custom-golemdb-v2.7.0-v1.0.0" }

# JSON-RPC server plumbing for the arkiv_* namespace. Pinned to the exact version
# reth v2.7.0 uses so the RpcModule we register merges into reth's rpc modules.
jsonrpsee = { version = "0.26", features = ["server"] }

# Common
clap = { version = "4", features = ["derive", "env"] }
eyre = "0.6"
tracing = "0.1"
turso = { version = "=0.7.2", default-features = false }

# alloy primitives used by the Arkiv protocol crates.
alloy-rlp = "0.3"
alloy-primitives = { version = "1.6", features = ["rlp"] }
alloy-consensus = "2.5"
alloy-evm = "0.39"

golemdb-api = { git = "https://github.com/Arkiv-Network/golemdb", tag = "v1.0.0" }
golemdb-cells = { git = "https://github.com/Arkiv-Network/golemdb", tag = "v1.0.0" }
golemdb-pruning = { git = "https://github.com/Arkiv-Network/golemdb", tag = "v1.0.0" }
golemdb-storage = { git = "https://github.com/Arkiv-Network/golemdb", tag = "v1.0.0" }
golemdb-storage-mdbx = { git = "https://github.com/Arkiv-Network/golemdb", tag = "v1.0.0" }

# alloy RPC client stack used by arkiv-cli (talks to a node over JSON-RPC) and
# arkiv-genesis (mnemonic-derived dev signers). Kept on the same 2.5 line reth
# v2.7.0 pins so cargo unifies these with reth's copies.
alloy-genesis = "2.5"
alloy-eips = "2.5"
alloy-sol-types = "1.6.1"
alloy-provider = "2.5"
alloy-signer-local = { version = "2.5", features = ["mnemonic"] }
alloy-rpc-types-engine = "2.5"
futures-util = "0.3"
alloy-network = "2.5"
alloy-contract = "2.5"
alloy-rpc-types = "2.5"

# Solidity bindings for the Arkiv EntityRegistry ABI, vendored from
# arkiv-contracts rev d6ebe18 (see crates/arkiv-bindings for the sync story).
arkiv-bindings = { path = "crates/arkiv-bindings" }

# CLI extras
tokio = { version = "1", features = ["full"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

# Internal
arkiv-interfaces = { path = "crates/arkiv-interfaces" }
arkiv-rpc-types = { path = "crates/arkiv-rpc-types" }
arkiv-query = { path = "crates/arkiv-query" }
arkiv-genesis = { path = "crates/arkiv-genesis" }
arkiv-harness = { path = "crates/arkiv-harness" }
arkiv-reth-executor = { path = "crates/arkiv-reth-executor" }
arkiv-reth-chainspec = { path = "crates/arkiv-reth-chainspec" }
arkiv-reth-uncommitted-store = { path = "crates/arkiv-reth-uncommitted-store" }
arkiv-reth-statemanager = { path = "crates/arkiv-reth-statemanager" }
arkiv-reth-rpc = { path = "crates/arkiv-reth-rpc" }
arkiv-golemdb-state = { path = "crates/arkiv-golemdb-state" }
arkiv-golemdb = { path = "crates/arkiv-golemdb" }
arkiv-reth-payload-builder = { path = "crates/arkiv-reth-payload-builder" }
arkiv-tokenomics = { path = "crates/arkiv-tokenomics" }

# Copied from yagna (.cargo/config). A dev build without debug info or
# incremental state, with dependencies optimized — much faster to link and to
# run than plain `dev`, at the cost of debuggability and rebuild speed.
[profile.dev-fast]
inherits = "dev"
debug = false
incremental = false
# `debug = false` stops rustc emitting debug info; this drops the symbol table
# the linker would still write, matching release-fast.
strip = "symbols"

# Set the default for dependencies.
[profile.dev-fast.package."*"]
opt-level = 2

# Also from yagna: an optimized build that trades some runtime speed for much
# shorter link times — no LTO, more codegen units, opt-level 2.
[profile.release-fast]
inherits = "release"
opt-level = 2
lto = "off"
codegen-units = 16
# `release` already carries no debug info; this drops the symbol table too.
strip = "symbols"

