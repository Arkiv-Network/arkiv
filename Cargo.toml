[workspace]
members = ["bin/*", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# reth, pinned to the tag the local checkout tracks (~/Projects/arkiv/reth).
# Docker builds the workspace in isolation, so reth must be a git dependency.
reth = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-ethereum-cli = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
# Umbrella crate used by the executor seam (matches the custom-evm example's deps).
# Keep default features (std); the executor crate adds "evm" + "node".
reth-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
# Read-side state access for the arkiv_* RPC (the StateProvider snapshot).
reth-storage-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }

# JSON-RPC server plumbing for the arkiv_* namespace. Pinned to the exact version
# reth v2.2.0 uses so the RpcModule we register merges into reth's rpc modules.
jsonrpsee = { version = "0.26", features = ["server"] }

# Common
clap = { version = "4", features = ["derive", "env"] }
eyre = "0.6"
tracing = "0.1"

# alloy + compression for the DA format (versions match what reth v2.2.0 already
# pins in Cargo.lock — adding them as direct deps resolves to the locked stack).
alloy-rlp = "0.3"
alloy-primitives = { version = "1.6", features = ["rlp"] }
alloy-consensus = "2.0"
alloy-evm = "0.34"
zstd = "0.13"

# Roaring bitmaps back the auxiliary store's equality index. Pinned exactly: a
# pair account's bitmap bytes are consensus state (its codeHash =
# keccak256(bitmap_bytes)), so the portable serialization must stay byte-for-byte
# stable across nodes — even a patch bump could shift it. =0.11.4 is what v1
# (arkiv-db-engine) used.
roaring = "=0.11.4"

# alloy RPC client stack used by arkiv-cli (talks to a node over JSON-RPC) and
# arkiv-genesis (mnemonic-derived dev signers). Pinned to =2.0.4: alloy-rpc-types
# 2.0.5+ requires alloy-rpc-types-engine ^2.0.5, whose only match is 2.1.0 — and
# 2.1.0 adds EthPayloadAttributes::target_gas_limit, a field reth v2.2.0 doesn't
# set, breaking the workspace build. 2.0.4 keeps the engine crate at 2.0.4.
alloy-genesis = "=2.0.4"
alloy-eips = "=2.0.4"
alloy-sol-types = "1.6.0"
alloy-provider = "=2.0.4"
alloy-signer-local = { version = "=2.0.4", features = ["mnemonic"] }
alloy-network = "=2.0.4"
alloy-contract = "=2.0.4"
alloy-rpc-types = "=2.0.4"

# Solidity bindings for the Arkiv EntityRegistry ABI, vendored from
# arkiv-contracts rev d6ebe18 (see crates/arkiv-bindings for the sync story).
arkiv-bindings = { path = "crates/arkiv-bindings" }

# CLI extras
tokio = { version = "1", features = ["full"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Internal
arkiv-constants = { path = "crates/arkiv-constants" }
arkiv-interfaces = { path = "crates/arkiv-interfaces" }
arkiv-query = { path = "crates/arkiv-query" }
arkiv-genesis = { path = "crates/arkiv-genesis" }
arkiv-harness = { path = "crates/arkiv-harness" }
arkiv-da = { path = "crates/arkiv-da" }
arkiv-committer = { path = "crates/arkiv-committer" }
arkiv-reth-executor = { path = "crates/arkiv-reth-executor" }
arkiv-reth-entitystore = { path = "crates/arkiv-reth-entitystore" }
arkiv-reth-auxstore = { path = "crates/arkiv-reth-auxstore" }
