[package]
name = "arkiv-reth-chainspec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The Arkiv chain specification: reth's `ChainSpec` with one protocol rule on
# top — the EIP-1559 base fee never drops below the genesis block's base fee —
# and GolemDB's settings from the genesis file. Also the `--chain` parser that
# produces it, so the node, the pool, the payload builder and consensus all see
# the same rule.

[dependencies]
# reth's stock `ChainSpec` and the traits (`EthChainSpec`, `Hardforks`,
# `EthereumHardforks`) the wrapper delegates to.
reth-ethereum.workspace = true
# The `ChainSpecParser` trait implemented by the genesis JSON/file reader.
reth-cli.workspace = true
# `NodeRecord`, the bootnode type in `EthChainSpec::bootnodes`.
reth-network-peers.workspace = true
# `EthExecutorSpec` (deposit contract address), required of a node's chain spec.
alloy-evm.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-genesis.workspace = true
alloy-primitives.workspace = true
eyre.workspace = true
# `config.arkiv` is read with serde.
serde.workspace = true
# Reads the built-in `dev` genesis.
serde_json.workspace = true
# GolemDB's genesis format, which `config.arkiv.golemdb` is in.
golemdb-api.workspace = true
arkiv-golemdb.workspace = true
# Validate the host weights required by FeeSchedule.
arkiv-tokenomics.workspace = true

[dev-dependencies]
alloy-rlp.workspace = true
# The entity record layout, to size a typical entity in the genesis files' pricing test.
arkiv-interfaces.workspace = true
