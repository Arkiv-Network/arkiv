[package]
name = "arkiv-golemdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Arkiv's `arkiv_interfaces::store::Store` over GolemDB, in-process: the store
# that holds Arkiv's state and its blocks, transactions and receipts.

[dependencies]
arkiv-interfaces.workspace = true
golemdb-api.workspace = true

[dev-dependencies]
arkiv-interfaces = { workspace = true, features = ["conformance"] }
arkiv-query.workspace = true
# `MAX_PAGE_SIZE`, the largest page `arkiv_query` asks GolemDB for.
arkiv-rpc-types.workspace = true
tempfile.workspace = true
