[package]
name = "arkiv-reth-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The Arkiv execution seam: a custom reth executor that replaces the stock EVM
# config. For now it is the stock Ethereum executor with an Arkiv-branded
# precompile registered at ARKIV_ADDRESS — i.e. it proves the *injection
# mechanism* end to end (the executor component the node assembles is ours).
# The fixed-function entity engine and the neutered-EVM policy land on top of
# this seam in later steps (see experiments/post-evm-execution-report.md §3).

[dependencies]
# The host-agnostic executor interface this crate implements (see arkiv.rs).
arkiv-interfaces.workspace = true
# The index's annotation encoder: `apply` diffs an entity's annotations to build
# the auxiliary delta, and this is the one place that maps an entity to its
# `(attr, value)` index pairs (shared with the query read path).
arkiv-reth-mpt-committed-store.workspace = true
# The state manager: lib.rs drives all state (entities, index, balances, nonces)
# through one write_manager (MptStateManager over the WriteOverlay).
arkiv-reth-statemanager.workspace = true
# The Solidity ABI (Operation[] calldata) the op decoder (decode.rs) parses.
arkiv-bindings.workspace = true

reth-ethereum = { workspace = true, features = ["evm", "node"] }
alloy-evm.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
eyre.workspace = true
tracing.workspace = true

[dev-dependencies]
# Integration tests wire calldata → decode_ops → apply → RethEntityStore →
# CodeBackend → WriteOverlay → EvmState, and build calldata via the SDK bindings.
arkiv-interfaces.workspace = true
arkiv-bindings.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
reth-ethereum = { workspace = true, features = ["evm", "node"] }
