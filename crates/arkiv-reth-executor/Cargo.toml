[package]
name = "arkiv-reth-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The Arkiv execution seam: a custom reth executor that replaces the stock EVM
# config. For now it is the stock Ethereum executor with an Arkiv-branded
# precompile registered at ARKIV_ADDRESS — i.e. it proves the *injection
# mechanism* end to end (the executor component the node assembles is ours).
# The fixed-function entity engine and the neutered-EVM policy land on top of
# this seam in later steps (see experiments/post-evm-execution-report.md §3).

[dependencies]
# Arkiv's shared types and the `StateView` traits the executor runs on.
arkiv-interfaces.workspace = true
# The host state view: lib.rs drives all state (entities, index, balances, nonces)
# through one `host_manager` view (`HostStateView` over the `WriteOverlay`).
arkiv-reth-statemanager.workspace = true
# The Solidity ABI (Operation[] calldata) the op decoder (decode.rs) parses.
arkiv-bindings.workspace = true
# The lifetime bound creates and extends are admitted by, and the fee schedule
# it comes from.
arkiv-tokenomics.workspace = true

reth-ethereum = { workspace = true, features = ["evm", "node"] }
alloy-evm.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
eyre.workspace = true
tracing.workspace = true

[dev-dependencies]
arkiv-golemdb-state.workspace = true
# In-memory GolemDB, the store the node runs on, for the executor's tests.
arkiv-golemdb.workspace = true
arkiv-interfaces = { workspace = true, features = ["conformance"] }
