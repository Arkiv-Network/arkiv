[package]
name = "arkiv-rpc-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The `arkiv_*` wire contract: request/response shapes, projection rules, error
# codes. Free of reth, jsonrpsee and any transport, so clients deserialize the
# same types the node serves. Server side is in arkiv-reth-rpc.

[dependencies]
arkiv-interfaces.workspace = true
alloy-primitives.workspace = true
# `BlockNumberOrTag` for the `atBlock` query option.
alloy-eips.workspace = true
serde.workspace = true
# Attribute values are rendered per type, so the wire value is a JSON value.
serde_json.workspace = true
