[package]
name = "arkiv-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# Node lifecycle (spawn/kill/restart of the arkiv-node binary) + a typed RPC
# client the black-box tests drive nodes through.
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-network.workspace = true
alloy-rpc-types.workspace = true
alloy-signer-local.workspace = true
alloy-sol-types.workspace = true
# The minimal CL driver (engine module): a JWT-authenticated Engine API client
# that drives a follower's fork choice so it replicates the sequencer (T2).
alloy-rpc-types-engine.workspace = true
alloy-rpc-client.workspace = true
alloy-transport-http.workspace = true
arkiv-bindings.workspace = true
# ARKIV_ADDRESS + derive_entity_key: protocol constants a client needs to build
# calldata and predict minted keys.
arkiv-reth-executor.workspace = true
serde_json.workspace = true
tokio.workspace = true
eyre.workspace = true
