[package]
name = "arkiv-seed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Builds a pre-populated Arkiv state for block 0: synthetic entities pushed
# through the real executor and store code over an in-memory base, then read
# back out as a genesis `alloc`, an ethereum-package preload object, or a
# `reth init-state` JSONL dump plus a `stateHash` genesis. Nothing here
# hand-rolls a storage layout — every byte comes from the same code the node
# runs per block.

[dependencies]
# The spec's entity/op types, the store seams, and the executor that turns
# `Op::Create`s into entity records.
arkiv-interfaces.workspace = true
arkiv-reth-executor.workspace = true
# `write_manager`: the production write path (MptStateView over WriteOverlay).
arkiv-reth-statemanager.workspace = true
# The index's bulk insert path and the annotation encoder.
arkiv-reth-mpt-committed-store.workspace = true
# `Ident32` — attribute-name validation, so a seed never writes a name the
# node's decoder would have refused.
arkiv-bindings.workspace = true

alloy-primitives.workspace = true
alloy-genesis.workspace = true
# The genesis state root over the finished alloc — the same function reth's
# chain spec uses, so the `stateHash` a JSONL dump advertises is exactly what
# `--chain <file>` would derive from the equivalent alloc.
alloy-trie.workspace = true
# RLP for the trie leaves the streaming root builder hashes.
alloy-rlp.workspace = true
# revm's `CacheDB`: the in-memory base the WriteOverlay stages against.
reth-ethereum = { workspace = true, features = ["evm"] }
serde.workspace = true
serde_json.workspace = true
eyre.workspace = true

[dev-dependencies]
tempfile.workspace = true
