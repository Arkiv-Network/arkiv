[package]
name = "arkiv-reth-mpt-committed-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The reth-host implementation of Arkiv's COMMITTED state — every consensus
# store, one module per lane, all multiplexed onto Ethereum's one keccak-MPT
# account state: the entities (account code), the query index (bitmap code +
# storage-slot B+ trees), account balances and transaction nonces (the accounts
# themselves), and entity-minting nonces (system-account slots). Ported, module
# by module, from the proven db-engine.
#
# Host-specific by nature: the physical layout is reth's business, not the
# Arkiv spec's — the spec only names the stores. The uncommitted state and the
# manager composing all lanes live in arkiv-reth-statemanager.

[dependencies]
arkiv-interfaces.workspace = true
alloy-primitives.workspace = true
alloy-rlp = { workspace = true, features = ["derive"] }
# Roaring bitmaps back the index's tier-1 equality buckets; see the pin note in
# the workspace manifest — the serialization is consensus state.
roaring.workspace = true
