[package]
name = "arkiv-genesis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Genesis primitives for the Arkiv chain: the precompile address and the
# mnemonic-derived dev-funding alloc. The ARKIV_ADDRESS constant is defined
# locally so genesis setup does not depend on another node architecture.

[dependencies]
# Only for `constants::ARKIV_ADDRESS` — genesis has to name the same address the
# executor routes to, and this is where that one value lives. Zero-dep no_std, so
# it costs nothing to depend on.
arkiv-interfaces.workspace = true
alloy-genesis.workspace = true
alloy-primitives.workspace = true
alloy-signer-local.workspace = true

eyre.workspace = true
