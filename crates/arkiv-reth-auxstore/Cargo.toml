[package]
name = "arkiv-reth-auxstore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The reth-host implementation of the Arkiv auxiliary (query index) store.
# Sibling to arkiv-reth-entitystore: where that crate implements
# arkiv-interfaces' `EntityStore` (the entities), this crate implements
# `AuxiliaryStore` (the index over them). Ported, module by module, from the
# proven db-engine.
#
# Host-specific by nature: how the index is physically laid out (bitmap buckets
# at derived account addresses, storage-slot B+ trees) is reth's business, not
# the Arkiv spec's — the spec only says "there is a committed query index".

[dependencies]
arkiv-constants.workspace = true
arkiv-interfaces.workspace = true
# For the `AccountCode` reth-state seam (tier-1 bitmaps live in account code) and
# the shared `SYSTEM_ACCOUNT_ADDRESS` where index bookkeeping (the id→key map)
# sits. The seam is a generic account-code accessor, not entity data — reusing it
# means the reth bridge implements it once for both stores. This crate holds no
# entity data; the dependency is trait- and address-only.
arkiv-reth-entitystore.workspace = true
alloy-primitives.workspace = true
roaring.workspace = true
