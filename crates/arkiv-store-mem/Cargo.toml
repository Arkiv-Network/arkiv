[package]
name = "arkiv-store-mem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The in-memory reference implementation of `arkiv_interfaces::store::Store`.
#
# Its job is to be *obviously correct*, not fast: it is the thing the
# conformance suite is first proved against, and the oracle every other
# implementation is compared to. Dependency-free and `no_std` + `alloc`, same
# discipline as the interface crate it implements.

[dependencies]
arkiv-interfaces.workspace = true

[dev-dependencies]
arkiv-interfaces = { workspace = true, features = ["conformance"] }
