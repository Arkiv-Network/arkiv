[package]
name = "arkiv-reth-statemanager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The reth-host `StateView`: Ethereum accounts for balances and transaction
# nonces, the Arkiv database (arkiv-store) for entities, minting nonces and
# the query index, and the anchor slot that ties the two together.

[dependencies]
# The StateManager trait family this crate implements.
arkiv-interfaces.workspace = true
# The database under its own root: entities, minting nonces, indexes.
arkiv-store.workspace = true
# The uncommitted lane(s): the pruning map.
arkiv-reth-uncommitted-store.workspace = true

alloy-primitives.workspace = true
# WriteOverlay reads through revm's Database and stages an EvmState diff.
reth-ethereum = { workspace = true, features = ["evm"] }
eyre.workspace = true
