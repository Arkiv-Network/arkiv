[package]
name = "arkiv-reth-statemanager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The reth-host state view. HostStateView puts Arkiv's state on GolemDB;
# WriteOverlay bridges revm's Database and accumulates the EvmState diff reth
# commits.

[dependencies]
# The StateView traits this crate implements.
arkiv-interfaces.workspace = true
arkiv-golemdb-state.workspace = true

# `alloc`, the genesis file's accounts.
alloy-genesis.workspace = true
alloy-primitives.workspace = true
# The append-only tier stores consensus encodings: RLP headers, EIP-2718
# transactions and receipts.
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-rlp.workspace = true
# WriteOverlay reads through revm's Database and stages an EvmState diff.
reth-ethereum = { workspace = true, features = ["evm"] }
# The engine's persistence seam: Arkiv runs its own service in place of reth's.
reth-engine-tree.workspace = true
reth-provider.workspace = true
tracing.workspace = true
eyre.workspace = true

[dev-dependencies]
arkiv-interfaces = { workspace = true, features = ["conformance"] }
