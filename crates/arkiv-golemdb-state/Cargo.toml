[package]
name = "arkiv-golemdb-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Arkiv's committed stores over a GolemDB `Store`, with entities as native
# records. Replaces arkiv-reth-mpt-committed-store, whose bulk is the index
# machinery GolemDB provides directly.

[dependencies]
arkiv-interfaces.workspace = true
arkiv-reth-uncommitted-store.workspace = true
# The fee schedule's record layout, which views read the block's schedule by.
arkiv-tokenomics.workspace = true

[dev-dependencies]
# The real engine, so the shared view contract runs against GolemDB too.
arkiv-golemdb.workspace = true
arkiv-interfaces = { workspace = true, features = ["conformance"] }
arkiv-valkey.workspace = true
