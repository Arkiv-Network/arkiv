# Args for ethpandaops/ethereum-package — the Arkiv chain.
# arkiv-reth EL + lighthouse CL; genesis / JWT / validators generated for us.
#
# This is a single Arkiv network with multiple Arkiv participants. There is no
# L1, L2, settlement chain, or cross-chain coordination.
#
# Schema: https://github.com/ethpandaops/ethereum-package#configuration

participants:
  # Participant 1 is the sole sequencer: its validator client proposes blocks.
  - el_type: reth
    el_image: arkiv-reth:dev
    el_extra_env_vars:
      # The node needs a store named. This devnet runs on GolemDB, inside the
      # datadir the package gives reth.
      ARKIV_STORE_PATH: /data/reth/execution-data/golemdb
      # How much history GolemDB keeps: `head-only` (the default), a number of
      # past blocks besides the head, or `archive` for every block.
      ARKIV_STORE_HISTORY: head-only
    cl_type: lighthouse
    # Lighthouse hands reth every block it syncs, in order. By default it skips
    # that for finalized blocks and leaves reth to sync them itself, which reth
    # does on GolemDB for 1024 blocks at most.
    cl_extra_params:
      - --disable-optimistic-finalized-sync
    validator_count: 1

  # Participant 2 is an Arkiv follower: it runs the EL and beacon node, but no
  # validator client, so it only follows the sequencer over P2P/consensus.
  - el_type: reth
    el_image: arkiv-reth:dev
    el_extra_env_vars:
      ARKIV_STORE_PATH: /data/reth/execution-data/golemdb
      ARKIV_STORE_HISTORY: head-only
    # Test-only: how far behind the finalized block reth syncs on its own,
    # 1024 blocks (about 37 minutes) unless set. Lowered so the restart tests
    # reach "further behind than that" with an outage of minutes. 33 is the
    # lowest value the node keeps: it treats reth's default, 32, as unset.
    # The restart tests read the value from here.
    el_extra_params:
      - --engine.backfill-threshold=33
    cl_type: lighthouse
    cl_extra_params:
      - --disable-optimistic-finalized-sync
    validator_count: 0

# GolemDB's settings in the genesis give block 0 GolemDB's state root, and so a
# hash the stock generator does not derive. This image adds the settings and
# writes arkiv-reth's block 0 to SHADOW_FORK_FILE, which the CL genesis is then
# built on (kurtosis/genesis-generator; up.py builds it).
ethereum_genesis_generator_params:
  image: arkiv-genesis-generator:dev
  extra_env:
    SHADOW_FORK_FILE: /data/metadata/arkiv-block-0.json

network_params:
  preset: minimal
  seconds_per_slot: 2
  # The two-node devnet has one validator and cannot satisfy Fulu's PeerDAS
  # supernode requirements. Keep Fulu disabled until the network is expanded.
  fulu_fork_epoch: 18446744073709551615
  bpo_1_epoch: 18446744073709551615
  bpo_2_epoch: 18446744073709551615
  bpo_3_epoch: 18446744073709551615
  bpo_4_epoch: 18446744073709551615
  bpo_5_epoch: 18446744073709551615

# Publish EL/CL host ports so local black-box tests can reach each participant.
# The package assigns subsequent ports to subsequent participants.
port_publisher:
  el:
    enabled: true
    public_port_start: 32000
  cl:
    enabled: true
    public_port_start: 33000
