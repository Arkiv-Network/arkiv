# Args for ethpandaops/ethereum-package — the Arkiv chain.
# arkiv-reth EL + lighthouse CL; genesis / JWT / validators generated for us.
#
# Run directly (the local wrapper approach fails: kurtosis can't import a remote
# package from a local one, so we run ethereum-package remotely and add the base
# chain as a second run into the same enclave — see scripts/kurtosis/up.sh).
#
# Schema: https://github.com/ethpandaops/ethereum-package#configuration

participants:
  # EL is our custom arkiv-reth image, driven as a standard reth client.
  - el_type: reth
    el_image: arkiv-reth:dev
    cl_type: lighthouse
  # To test watcher keep-up, add a second follower participant here.

network_params:
  preset: minimal
  seconds_per_slot: 4

# Publish EL/CL host ports at deterministic numbers so the harness can hardcode
# endpoints instead of discovering kurtosis' random allocations.
port_publisher:
  el:
    enabled: true
    public_port_start: 32000
  cl:
    enabled: true
    public_port_start: 33000
