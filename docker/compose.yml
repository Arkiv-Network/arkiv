# A single-node dev stack: one auto-sealing arkiv-reth, on GolemDB.
#
#   docker buildx build -t arkiv-reth:dev -f docker/arkiv-reth.Dockerfile .
#   docker compose -f docker/compose.yml up -d --wait
#   scripts/kurtosis/check.py --no-enclave --sequencer-rpc http://127.0.0.1:8545
#   docker compose -f docker/compose.yml down -v
#
# For a real two-node network with a consensus layer, use Kurtosis
# (scripts/kurtosis/up.py). This is for a node you can poke at, without the
# enclave.

services:
  arkiv-reth:
    # Built by scripts/kurtosis/up.py, or by hand with the buildx line above.
    image: arkiv-reth:dev
    ports:
      - "8545:8545"
    environment:
      # The node needs a store named. This dev stack runs on GolemDB, kept in
      # the node-data volume next to the datadir.
      ARKIV_STORE_PATH: /data/golemdb
      # How much history GolemDB keeps: `head-only` (the default), a number of
      # past blocks besides the head, or `archive` for every block.
      ARKIV_STORE_HISTORY: head-only
    command:
      - node
      - --dev
      # Without a block time, --dev seals only when a transaction arrives, and
      # a health check that waits for block production would hang forever.
      - --dev.block-time
      - 2s
      - --datadir
      - /data
      - --http
      - --http.addr
      - 0.0.0.0
      # Deliberately not listing `arkiv`: reth validates --http.api against its
      # own namespace enum and rejects unknown names. The arkiv_* methods arrive
      # via `merge_configured` in main.rs, which bypasses this allowlist — which
      # is also why the Kurtosis args file never sets --http.api either.
      - --http.api
      - eth,net,web3
      # CI sets ARKIV_LOG_FILTER=debug so a failure shows what the node was
      # doing; locally `info` keeps the console readable.
      - --log.stdout.filter
      - ${ARKIV_LOG_FILTER:-info}
    volumes:
      - node-data:/data
    healthcheck:
      # The image is debian-slim with no curl, so this opens the RPC port over
      # bash's /dev/tcp rather than speaking HTTP. Port open is enough to gate
      # `up --wait`; scripts/node-check.py does the real verification.
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8545'"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  node-data:
