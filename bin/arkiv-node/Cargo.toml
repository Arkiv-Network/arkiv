[package]
name = "arkiv-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "arkiv-node"
path = "src/main.rs"

[dependencies]
reth.workspace = true
reth-ethereum-cli.workspace = true
reth-node-ethereum.workspace = true
reth-storage-api.workspace = true
arkiv-reth-executor.workspace = true
# The entity store + spec types the arkiv_getEntity read path reads through.
arkiv-reth-entitystore.workspace = true
arkiv-interfaces.workspace = true
jsonrpsee.workspace = true
alloy-primitives.workspace = true
serde.workspace = true
tokio.workspace = true
eyre.workspace = true
clap.workspace = true
tracing.workspace = true

[dev-dependencies]
# The end-to-end test spawns this node binary and drives it like a client:
# build create calldata (arkiv-bindings), send it (alloy), and read the entity
# back over arkiv_getEntity. derive_entity_key/ARKIV_ADDRESS come from the executor.
arkiv-bindings.workspace = true
arkiv-reth-executor.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-signer-local.workspace = true
alloy-network.workspace = true
alloy-contract.workspace = true
alloy-sol-types.workspace = true
tokio.workspace = true
serde_json.workspace = true
eyre.workspace = true
