[package]
name = "arkiv-reth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "arkiv-reth"
path = "src/main.rs"

# The assembly point and nothing else: reth's host plus the two things Arkiv
# replaces. Anything more than wiring belongs in one of the crates below.

[dependencies]
reth.workspace = true
# Only for the `#[global_allocator]` declaration in main.rs.
reth-cli-util.workspace = true
reth-ethereum-cli.workspace = true
reth-node-ethereum.workspace = true
reth-ethereum.workspace = true
# The executor replacing reth's EVM component.
arkiv-reth-executor.workspace = true
arkiv-reth-payload-builder.workspace = true
# The arkiv_* namespace merged into reth's rpc modules.
arkiv-reth-rpc.workspace = true
eyre.workspace = true
clap.workspace = true
tracing.workspace = true

[dev-dependencies]
# The black-box tests spawn this node binary and drive it through the harness:
# arkiv-harness owns node lifecycle (spawn/kill/restart) + the typed RPC client;
# the tests build calldata with arkiv-bindings and decode EntityOperation logs.
arkiv-harness.workspace = true
arkiv-bindings.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-signer-local.workspace = true
alloy-sol-types.workspace = true
# The deploy-tx stall regression builds a raw contract-creation
# TransactionRequest — the typed ArkivClient path only sends entity calls.
alloy-network.workspace = true
alloy-rpc-types.workspace = true
tokio.workspace = true
serde_json.workspace = true
futures-util.workspace = true
