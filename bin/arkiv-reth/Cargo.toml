[package]
name = "arkiv-reth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "arkiv-reth"
path = "src/main.rs"

[dependencies]
reth.workspace = true
reth-ethereum-cli.workspace = true
reth-node-ethereum.workspace = true
reth-storage-api.workspace = true
arkiv-reth-executor.workspace = true
# The entity store + spec types the arkiv_getEntity read path reads through.
arkiv-reth-entitystore.workspace = true
# The query index (arkiv_query evaluates against it) + the query-language parser.
arkiv-reth-auxstore.workspace = true
arkiv-query.workspace = true
arkiv-interfaces.workspace = true
jsonrpsee.workspace = true
alloy-primitives.workspace = true
# The `BlockHeader` trait (timestamp/number) for arkiv_getBlockTiming.
alloy-consensus.workspace = true
# `BlockNumberOrTag` for the `atBlock` query option.
alloy-eips.workspace = true
serde.workspace = true
# Attribute values are rendered per type (number, bool, string, hex), so the wire
# value is a JSON value rather than a formatted string.
serde_json.workspace = true
# Query cursors are opaque and bound to their query — base64 of an id plus a
# binding hash, per the `b64:` form in the spec.
base64 = "0.22"
tokio.workspace = true
eyre.workspace = true
clap.workspace = true
tracing.workspace = true

[dev-dependencies]
# The black-box tests spawn this node binary and drive it through the harness:
# arkiv-harness owns node lifecycle (spawn/kill/restart) + the typed RPC client;
# the tests build calldata with arkiv-bindings and decode EntityOperation logs.
arkiv-harness.workspace = true
arkiv-bindings.workspace = true
alloy-primitives.workspace = true
alloy-provider.workspace = true
alloy-signer-local.workspace = true
alloy-sol-types.workspace = true
tokio.workspace = true
serde_json.workspace = true
