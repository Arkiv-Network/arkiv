# Two-node devnet smoke test.
#
# Normally called by `pr-artifact` once the binaries are built, so it packages
# that `arkiv-reth` into the image instead of recompiling the reth tree inside
# BuildKit. Dispatched on its own it falls back to the from-source Dockerfile,
# which is slow but self-contained.
name: kurtosis

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact:
        description: "Artifact holding a prebuilt arkiv-reth; empty builds from source"
        required: false
        default: ""
        type: string

# Literal prefix, not `github.workflow`: called from another workflow that
# name resolves to the *caller*, which would put this job in the same group as
# the run that is waiting on it.
concurrency:
  group: kurtosis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  two-node-smoke:
    name: sequencer + follower smoke test
    runs-on: ubuntu-latest
    # Packaging a prebuilt binary is minutes; a from-source dispatch is closer
    # to an hour, so the timeout has to cover the slow path.
    timeout-minutes: 180
    permissions:
      contents: read
      # download-artifact reads the run's artifacts through the API.
      actions: read
    env:
      CI: "true"
      RUST_BACKTRACE: "1"
      ARTIFACT: ${{ inputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Only the from-source path compiles anything on the runner.
      - name: Install native build dependencies
        if: inputs.artifact == ''
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev clang cmake build-essential

      - name: Fetch the prebuilt arkiv-reth
        if: inputs.artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact }}
          path: prebuilt

      - name: Install Kurtosis CLI
        run: |
          set -euxo pipefail
          echo 'deb [trusted=yes] https://sdk.kurtosis.com/kurtosis-cli-release-artifacts/ /' \
            | sudo tee /etc/apt/sources.list.d/kurtosis.list
          sudo apt-get update
          sudo apt-get install -y kurtosis-cli

      - name: Verify CI runtime
        run: |
          set -euxo pipefail
          docker --version
          docker info
          kurtosis version
          kurtosis engine status || true

      - name: Start sequencer and follower and run health check
        run: |
          set -euxo pipefail
          # up.py packages this binary when the variable is set, and builds the
          # image from source when it is empty.
          if [ -n "$ARTIFACT" ]; then
            chmod +x prebuilt/arkiv-reth
            export ARKIV_RETH_BINARY="$PWD/prebuilt/arkiv-reth"
          fi
          python3 scripts/kurtosis/up.py arkiv-harness

      - name: Collect Kurtosis diagnostics
        if: always()
        run: |
          set +e
          echo '--- Kurtosis enclaves ---'
          kurtosis enclave ls
          echo '--- Arkiv enclave ---'
          kurtosis enclave inspect arkiv-harness
          echo '--- Arkiv service logs ---'
          kurtosis service logs --all-services --num 200 arkiv-harness

      - name: Tear down Kurtosis enclave
        if: always()
        run: |
          set +e
          python3 scripts/kurtosis/down.py arkiv-harness
