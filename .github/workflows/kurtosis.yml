# Two-node devnet smoke test.
#
# Normally called by `pr-artifact` once the binaries are built, so it packages
# that `arkiv-reth` into the image instead of recompiling the reth tree inside
# BuildKit. Dispatched on its own it falls back to the from-source Dockerfile,
# which is slow but self-contained.
name: kurtosis

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact:
        description: "Artifact holding a prebuilt arkiv-reth; empty builds from source"
        required: false
        default: ""
        type: string

jobs:
  two-node-smoke:
    name: sequencer + follower smoke test
    runs-on: ubuntu-latest
    # Job-level, and with a literal prefix rather than `github.workflow`: when
    # called that name resolves to the *caller*, which would put this in the
    # same concurrency group as the run waiting on it.
    concurrency:
      group: kurtosis-${{ github.ref }}
      cancel-in-progress: false
    # Packaging a prebuilt binary is minutes; a from-source dispatch is closer
    # to an hour, so the timeout has to cover the slow path.
    timeout-minutes: 180
    env:
      CI: "true"
      RUST_BACKTRACE: "1"
      ARTIFACT: ${{ inputs.artifact }}
      # Two compile jobs keep a from-source image build within the runner's
      # memory; `just image` passes this into the Docker build.
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The devnet and SDK test steps are just recipes (just/devnet.just), the
      # same ones used locally.
      - uses: taiki-e/install-action@just

      # Nothing compiles on the runner: the from-source path builds the image
      # inside Docker. The artifact also carries arkiv-cli, which the devnet
      # does not use.
      - name: Fetch the prebuilt arkiv-reth
        if: inputs.artifact != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact }}
          path: prebuilt

      - name: Install Kurtosis CLI
        run: |
          set -euxo pipefail
          echo 'deb [trusted=yes] https://sdk.kurtosis.com/kurtosis-cli-release-artifacts/ /' \
            | sudo tee /etc/apt/sources.list.d/kurtosis.list
          sudo apt-get update
          sudo apt-get install -y kurtosis-cli

      - name: Verify CI runtime
        run: |
          set -euxo pipefail
          docker --version
          docker info
          kurtosis version
          kurtosis engine status || true

      - name: Start sequencer and follower and run health check
        run: |
          set -euxo pipefail
          if [ -n "$ARTIFACT" ]; then
            just devnet_up_prebuilt prebuilt/arkiv-reth
          else
            just devnet_up
          fi

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Drives the running enclave through the Arkiv SDK; see
      # kurtosis/integration/README.md for what is covered.
      - name: Run SDK integration tests
        run: just sdk_test

      # After the other tests, and whether or not they passed: these stop and
      # start the follower, and one that fails to catch up stays behind.
      - name: Restart the follower and check it catches up
        if: success() || failure()
        run: just sdk_restart_test

      - name: Collect Kurtosis diagnostics
        if: always()
        run: just devnet_logs

      - name: Tear down Kurtosis enclave
        if: always()
        run: just devnet_down
