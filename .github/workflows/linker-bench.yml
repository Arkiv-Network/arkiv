# Compares linkers on a cold build of the workspace.
#
# This has to be a cold build: RUSTFLAGS is part of cargo's fingerprint, so
# changing the linker invalidates every unit in a restored cache. Whichever
# linker wins here belongs in the build that produces the cache, and warm
# builds inherit the shorter tail from it.
#
# The 373s warm build spends ~303s between the last `Compiling` line and
# `Finished` — codegen and linking of arkiv-reth (75 MB) and arkiv-cli. That
# tail is what this measures.
name: linker-bench

on:
  workflow_dispatch:
  push:
    branches: [scx1332/ci-optimizations]
    paths: [".github/workflows/linker-bench.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default: rustc drives cc, which uses GNU ld.
          - linker: default
            apt: ""
            flags: ""
          - linker: lld
            apt: "lld"
            flags: "-C link-arg=-fuse-ld=lld"
          - linker: mold
            apt: "mold"
            flags: "-C link-arg=-fuse-ld=mold"
    name: ${{ matrix.linker }}
    env:
      PROFILE: release-fast
      RUSTFLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev clang cmake build-essential ${{ matrix.apt }}
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Cold build with ${{ matrix.linker }}
        id: build
        run: |
          set -euo pipefail
          ${{ matrix.linker != 'default' && format('{0} --version | head -1', matrix.linker) || 'ld --version | head -1' }}
          t0=$(date +%s)
          # Timestamp every cargo line so the codegen/link tail can be
          # separated from the dependency compiles.
          cargo build --workspace --locked --profile "$PROFILE" 2>&1 \
            | while IFS= read -r line; do printf '%s %s\n' "$(date +%s)" "$line"; done \
            | tee build.log
          total=$(( $(date +%s) - t0 ))

          last_compiling=$(grep ' Compiling ' build.log | tail -1 | cut -d' ' -f1 || echo "")
          finished=$(grep ' Finished ' build.log | tail -1 | cut -d' ' -f1 || echo "")
          tail_s=""
          if [ -n "$last_compiling" ] && [ -n "$finished" ]; then
            tail_s=$(( finished - last_compiling ))
          fi
          {
            echo "total=$total"
            echo "tail=${tail_s:-unknown}"
            echo "compiled=$(grep -c ' Compiling ' build.log || true)"
          } >> "$GITHUB_OUTPUT"

      - if: always()
        run: |
          {
            echo "### ${{ matrix.linker }}"
            echo
            echo "- total: ${{ steps.build.outputs.total }}s (baseline GNU ld: 1490s)"
            echo "- last Compiling -> Finished: ${{ steps.build.outputs.tail }}s"
            echo "- units compiled: ${{ steps.build.outputs.compiled }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        run: ls -l target/${{ env.PROFILE }}/arkiv-reth target/${{ env.PROFILE }}/arkiv-cli || true
