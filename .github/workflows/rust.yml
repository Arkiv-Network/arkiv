name: rust
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build:
    runs-on: ubuntu-latest
    # reth binaries are large; linking them with debug info OOMs the runner's
    # linker (ld bus error). This job only checks the workspace compiles, so
    # drop debug info to keep peak linker memory under the ~7 GB limit.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      # reth pulls C deps (libmdbx via bindgen, etc.) — same set the Dockerfile installs.
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev clang cmake build-essential
      # arkiv-bindings' build.rs shells out to `forge build`, so Foundry must be on PATH.
      - uses: foundry-rs/foundry-toolchain@v1
      # Caches ~/.cargo registry+git and ./target, keyed on Cargo.lock.
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  test:
    runs-on: ubuntu-latest
    # Same reasoning as `build`: drop debug info so linking the reth test
    # binaries doesn't OOM the runner's linker.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      # reth pulls C deps (libmdbx via bindgen, etc.) — same set the Dockerfile installs.
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev clang cmake build-essential
      # arkiv-bindings' build.rs shells out to `forge build`, so Foundry must be on PATH.
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      # nextest is the test runner; installed from a prebuilt binary.
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --locked

  # Builds both images, pushing them to GHCR on main commits and `v*`
  # tags; manual dispatch runs build and refresh the caches without pushing
  # image tags. The Dockerfiles' cargo-chef stages are identical up to the
  # final `cargo build --bin`, so dependency compilation is a single shared
  # layer: the two sequential builds hit it through the buildx builder's local
  # cache within a run, and through the per-image `buildcache` tag on GHCR
  # across runs.
  docker:
    runs-on: ubuntu-latest
    needs: [fmt, test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` moves only with main commits; tag pushes add the version tag.
      - id: meta-reth
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/arkiv-network/arkiv-reth
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/arkiv-reth.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-reth.outputs.tags }}
          labels: ${{ steps.meta-reth.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/arkiv-network/arkiv-reth:buildcache
          cache-to: type=registry,ref=ghcr.io/arkiv-network/arkiv-reth:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - id: meta-committer
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/arkiv-network/arkiv-committer
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/arkiv-committer.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-committer.outputs.tags }}
          labels: ${{ steps.meta-committer.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/arkiv-network/arkiv-committer:buildcache
          cache-to: type=registry,ref=ghcr.io/arkiv-network/arkiv-committer:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
