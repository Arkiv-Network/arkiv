name: rust
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build:
    runs-on: ubuntu-latest
    # reth binaries are large; linking them with debug info OOMs the runner's
    # linker (ld bus error). This job only checks the workspace compiles, so
    # drop debug info to keep peak linker memory under the ~7 GB limit.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      # reth pulls C deps (libmdbx via bindgen, etc.) — same set the Dockerfile installs.
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev clang cmake build-essential
      # Caches ~/.cargo registry+git and ./target, keyed on Cargo.lock.
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  test:
    runs-on: ubuntu-latest
    # Same reasoning as `build`: drop debug info so linking the reth test
    # binaries doesn't OOM the runner's linker.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      # reth pulls C deps (libmdbx via bindgen, etc.) — same set the Dockerfile installs.
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev clang cmake build-essential
      - uses: Swatinem/rust-cache@v2
      # nextest is the test runner; installed from a prebuilt binary.
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --locked

  # Builds both images (prod `arkiv`, dev `arkiv-dev` with arkiv-cli) and pushes
  # them to GHCR on pushes to main; PRs build without pushing. One job,
  # sequential builds: the Dockerfiles share a byte-identical builder stage, so
  # the second image's compile is a BuildKit cache hit.
  docker:
    runs-on: ubuntu-latest
    needs: [fmt, test]
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Skipped on PRs so fork PRs (whose GITHUB_TOKEN lacks packages:write) don't fail.
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercase required by GHCR (the org is Arkiv-Network).
          images: ghcr.io/arkiv-network/arkiv
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/arkiv-node.Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arkiv
          cache-to: type=gha,scope=arkiv,mode=max

      - id: meta-dev
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/arkiv-network/arkiv-dev
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/arkiv-node-dev.Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}
          cache-from: type=gha,scope=arkiv-dev
          cache-to: type=gha,scope=arkiv-dev,mode=max
