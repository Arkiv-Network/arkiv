name: rust
# The heavyweight lane, and no longer a pull-request gate: `pr-checks` and
# `pr-artifact` cover fmt, tests, clippy and the binaries from a restored cache
# in a fraction of the time. What is left here runs on main and on tags, where
# thoroughness matters more than latency — udeps, a plain-`dev` compile, and
# the multi-arch image publish that moves `latest`.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/arkiv-network

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # reth binaries are large; linking them with debug info OOMs the runner's
    # linker (ld bus error). This job only checks the workspace compiles, so
    # drop debug info to keep peak linker memory under the ~7 GB limit.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      # reth pulls C deps (libmdbx via bindgen, etc.) — same set the Dockerfile installs.
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev clang cmake build-essential
      # arkiv-bindings' build.rs shells out to `forge build`, so Foundry must be on PATH.
      - uses: foundry-rs/foundry-toolchain@v1
      # Caches ~/.cargo registry+git and ./target, keyed on Cargo.lock.
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Same reasoning as `build`: drop debug info so linking the reth test
    # binaries doesn't OOM the runner's linker.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      # reth pulls C deps (libmdbx via bindgen, etc.) — same set the Dockerfile installs.
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev clang cmake build-essential
      # arkiv-bindings' build.rs shells out to `forge build`, so Foundry must be on PATH.
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      # nextest is the test runner; installed from a prebuilt binary.
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --locked

  # The suites that need a real server are #[ignore] by default and run here
  # against a service container: arkiv-valkey's store conformance, and
  # arkiv-golemdb-state's view over it. A fake backend would only prove our
  # model of Valkey is self-consistent, which MemStore already does without a
  # network.
  valkey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      VALKEY_URL: redis://127.0.0.1:6379
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # Only these crates and their dependencies, so the job does not pay for
      # the reth build the other jobs already cover.
      - run: cargo test -p arkiv-valkey -p arkiv-golemdb-state --locked -- --ignored

  udeps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Same reasoning as `build`: drop debug info so linking during the udeps
    # analysis build doesn't OOM the runner's linker.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      # cargo-udeps needs a nightly rustc to run its analysis, independent of
      # the workspace's pinned 1.97 stable toolchain.
      - uses: dtolnay/rust-toolchain@nightly
      # reth pulls C deps (libmdbx via bindgen, etc.) — same set the Dockerfile installs.
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev clang cmake build-essential
      # arkiv-bindings' build.rs shells out to `forge build`, so Foundry must be on PATH.
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-udeps
      # rust-toolchain.toml pins 1.97, which overrides `rustup default nightly`;
      # `+nightly` is needed to actually invoke the nightly rustc udeps requires.
      - run: cargo +nightly udeps --workspace --locked

  # Builds all three images once per platform, each leg on a runner of that
  # architecture. Each platform job pushes every image by digest only;
  # `docker-manifest` then binds the tags to a manifest list spanning both
  # platforms, so a pull resolves to the host's architecture. Manual dispatch
  # builds without pushing images, though it still writes the per-platform
  # `buildcache` tags.
  #
  # The Dockerfiles' cargo-chef stages are identical up to the final
  # `cargo build --bin`, so dependency compilation is a single shared layer:
  # the three sequential builds hit it through the buildx builder's local cache
  # within a run, and through the per-image, per-platform `buildcache` tag on
  # GHCR across runs.
  docker:
    needs: [fmt, test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      # One platform failing leaves the other's digests pushed, so a rerun only
      # repeats the leg that broke.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # A cold run compiles the whole dependency tree and then uploads it as
    # registry cache, which together take upwards of an hour and a half; a run
    # that finds its cache warm finishes in a fraction of that.
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are bound in `docker-manifest`; the metadata steps here supply the
      # OCI labels that go into each per-platform image.
      - id: meta-reth
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/arkiv-reth
      - id: build-reth
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/arkiv-reth.Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta-reth.outputs.labels }}
          outputs: ${{ github.event_name == 'push' && format('type=image,name={0}/arkiv-reth,push-by-digest=true,name-canonical=true,push=true', env.REGISTRY) || 'type=cacheonly' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/arkiv-reth:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/arkiv-reth:buildcache-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true

      - id: meta-reth-dev
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/arkiv-reth-dev
      - id: build-reth-dev
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/arkiv-reth-dev.Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta-reth-dev.outputs.labels }}
          outputs: ${{ github.event_name == 'push' && format('type=image,name={0}/arkiv-reth-dev,push-by-digest=true,name-canonical=true,push=true', env.REGISTRY) || 'type=cacheonly' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/arkiv-reth-dev:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/arkiv-reth-dev:buildcache-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true

      # One artifact per platform, holding an empty file named after each
      # image's digest — the merge job turns those names back into references.
      - if: github.event_name == 'push'
        env:
          DIGEST_RETH: ${{ steps.build-reth.outputs.digest }}
          DIGEST_RETH_DEV: ${{ steps.build-reth-dev.outputs.digest }}
        run: |
          mkdir -p /tmp/digests/arkiv-reth /tmp/digests/arkiv-reth-dev
          touch "/tmp/digests/arkiv-reth/${DIGEST_RETH#sha256:}"
          touch "/tmp/digests/arkiv-reth-dev/${DIGEST_RETH_DEV#sha256:}"
      # Artifact names are immutable within a run, so re-running a leg that
      # already uploaded needs `overwrite`. The retention window has to outlast
      # a weekend: re-running one leg reads the other's digests from the
      # original attempt, and an expired artifact would leave the merge job
      # with a single platform.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Binds each image's tags to a manifest list over the per-platform digests
  # both build jobs pushed.
  docker-manifest:
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      # Each image's tags are bound independently, so one image's registry
      # failure must not cancel the others and leave the tag set skewed across
      # images.
      fail-fast: false
      matrix:
        image: [arkiv-reth, arkiv-reth-dev]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` moves only with main commits; tag pushes add the version tag.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      # Both platforms must be in hand before the tags move: a list built from
      # a subset resolves on one architecture and fails to pull on the other.
      - working-directory: /tmp/digests/${{ matrix.image }}
        run: |
          found=$(ls -1 | wc -l | tr -d ' ')
          if [ "$found" -ne 2 ]; then
            echo "::error::${{ matrix.image }}: expected one digest per platform, found $found"
            exit 1
          fi
      - working-directory: /tmp/digests/${{ matrix.image }}
        run: |
          # Both substitutions expand to several arguments — one -t per tag,
          # one reference per digest file — so the splitting is deliberate.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ matrix.image }}@sha256:%s ' *)

      - env:
          REF: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$REF"
          # Attestation manifests report a platform of unknown/unknown.
          platforms=$(docker buildx imagetools inspect --raw "$REF" | jq -r \
            '[.manifests[].platform | select(.os != null and .os != "unknown")
              | "\(.os)/\(.architecture)"] | unique | join(",")')
          if [ "$platforms" != "linux/amd64,linux/arm64" ]; then
            echo "::error::$REF covers $platforms"
            exit 1
          fi
