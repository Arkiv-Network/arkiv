# Python formatting for the helper scripts. Independent of the Rust lanes: it
# needs no toolchain, no build cache and no runner time to speak of, so it runs
# on its own rather than queueing behind pr-checks.
#
# `just fmt_py` runs the black release pinned in just/code_check.just, the same
# one .pre-commit-config.yaml uses, so CI and the local hook agree.
name: lint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  black:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - run: just fmt_py --check --diff
