# Measures a from-scratch workspace build — no Swatinem/rust-cache, no
# restored target dir — and hands the resulting artifacts back so the work
# isn't thrown away with the runner.
#
# Not a gate: it runs on dispatch, plus pushes to this measurement branch
# only, since `workflow_dispatch` alone is undispatchable until the file
# reaches the default branch.
name: cold-build

on:
  push:
    branches: [scx1332/ci-optimizations]
    # Editing workflows or docs must not kick off a 25-minute cold build;
    # only a change that could alter compilation is worth re-measuring.
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo profile to build"
        required: false
        default: "release-fast"
        type: choice
        options: [release-fast, dev-fast, dev, release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # A push event carries no inputs, so the profile falls back to the same
    # default the dispatch form offers.
    env:
      PROFILE: ${{ inputs.profile || 'release-fast' }}
    # A cold build of the reth tree with no cache at all; the cached `build`
    # job in `rust` takes ~10 minutes, so leave generous headroom.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97
      # reth pulls C deps (libmdbx via bindgen, etc.) — same set the Dockerfile installs.
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev clang cmake build-essential zstd
      # arkiv-bindings' build.rs shells out to `forge build`, so Foundry must be on PATH.
      - uses: foundry-rs/foundry-toolchain@v1

      # Deliberately no Swatinem/rust-cache here: a restored target dir or
      # registry would defeat the point of the measurement.
      - id: build
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo build --workspace --locked --profile "$PROFILE" --timings
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      # Drop the C intermediates jemalloc and rocksdb leave behind once their
      # .a archives exist — ~1200 files, ~174 MB, that nothing links against.
      #
      # Nothing else here is dead weight: deps/*.rmeta is what lets dependent
      # crates typecheck without recompiling, .fingerprint decides freshness,
      # and both copies of libjemalloc.a stay because the build script emits
      # rustc-link-search pointing at out/build/lib.
      - if: always()
        id: prune
        run: |
          set -euo pipefail
          before=$(du -sm target | cut -f1)
          count=$(find target -name '*.o' | wc -l)
          find target -name '*.o' -delete
          after=$(du -sm target | cut -f1)
          echo "pruned $count object files: ${before}MB -> ${after}MB"
          {
            echo "before=${before}"
            echo "after=${after}"
            echo "removed=${count}"
          } >> "$GITHUB_OUTPUT"

      - if: always()
        env:
          SECONDS_ELAPSED: ${{ steps.build.outputs.seconds }}
        run: |
          {
            echo "## cold build ($PROFILE)"
            echo
            echo "- wall time: ${SECONDS_ELAPSED:-n/a}s"
            echo "- target size: ${{ steps.prune.outputs.before }}MB -> ${{ steps.prune.outputs.after }}MB"
            echo "- pruned: ${{ steps.prune.outputs.removed }} object files"
          } >> "$GITHUB_STEP_SUMMARY"

      # upload-artifact zips its input, which is slow and lossy for a target
      # dir full of small files with meaningful mtimes. One zstd tarball
      # uploads far faster and restores a target dir cargo can still reuse.
      - if: always()
        run: |
          set -euo pipefail
          # `tar --zstd` compresses at level 3; level 10 with a 128 MB window
          # is ~21% smaller for a few extra seconds, and still unpacks with a
          # plain `tar --zstd -xf`.
          #
          # The tree was pruned in place by the step above, so this packs
          # exactly what a restored build cache needs.
          tar -I 'zstd -10 -T0 --long=27' \
            -cf "target-${{ env.PROFILE }}.tar.zst" \
            -C . target
          ls -lh "target-${{ env.PROFILE }}.tar.zst"

      # Published as an OCI artifact rather than a Docker image layer: oras
      # stores the blob byte-for-byte, so the zstd tarball stays 511 MB. An
      # image layer would be gzipped by the builder instead, which is both
      # slower and considerably larger on already-compressed input.
      - if: always() && github.event_name != 'pull_request'
        uses: oras-project/setup-oras@v2
      - if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECONDS_ELAPSED: ${{ steps.build.outputs.seconds }}
        run: |
          set -euo pipefail
          oras login ghcr.io -u '${{ github.actor }}' --password-stdin <<< "$GH_TOKEN"
          pkg="ghcr.io/arkiv-network/arkiv-build-cache"
          file="target-${{ env.PROFILE }}.tar.zst"
          oras push \
            "$pkg:${{ env.PROFILE }}-${GITHUB_SHA::12}" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "network.arkiv.profile=${{ env.PROFILE }}" \
            --annotation "network.arkiv.build-seconds=${SECONDS_ELAPSED:-unknown}" \
            "$file:application/vnd.arkiv.build-cache.v1.tar+zstd"
          echo "- package: \`$pkg:${{ env.PROFILE }}-${GITHUB_SHA::12}\`" >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: target-${{ env.PROFILE }}
          path: target-${{ env.PROFILE }}.tar.zst
          if-no-files-found: error
          # Large; keep it only long enough to pull down.
          retention-days: 3
          # Already zstd-compressed — re-zipping it just burns runner time.
          compression-level: 0
