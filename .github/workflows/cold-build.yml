# Rebuilds the shared build cache from scratch and republishes it under one
# mutable tag.
#
# One package, one version per profile, tagged by profile name. `pr-artifact`
# and `pr-checks` restore whichever tag matches the profile they build with, so
# this is the only thing that writes them — and the version a tag move leaves
# behind is deleted, rather than accumulating a 772 MB blob per commit.
#
# Only dev-fast is published for now. The matrix is kept so a second profile
# is one list entry away, but measuring two optimisation levels at once made
# every timing ambiguous, so the comparison lane is parked.
#
# It builds the workspace binaries, the test binaries and the clippy checks:
# dev-dependencies pull a larger graph, and a cache that covers them serves the
# binary lane just as well (measured: 366s from the test cache vs 373s from a
# binary-only one). Clippy is in there because its check units are distinct
# from the build ones — see the step for why.
name: cold-build

on:
  # Nightly from main. Rebuilding the cache is a deliberate act, never
  # something a source change triggers: outside the schedule it is dispatch
  # only.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  PACKAGE: ghcr.io/arkiv-network/arkiv-build-cache
  ARCHIVE: target-cache.tar.zst

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Per profile, so the two legs never queue behind each other.
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.profile }}
      cancel-in-progress: false
    strategy:
      # One profile failing must not cancel the other: each publishes its own
      # tag, and a half-refreshed pair is still usable.
      fail-fast: false
      matrix:
        profile: [dev-fast]
    env:
      PROFILE: ${{ matrix.profile }}
    # A cold build of the reth tree with no cache at all took ~25 minutes for
    # the binaries alone; the tests add to that. Leave generous headroom.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97
        with:
          # clippy checks the workspace below, so its artifacts land in the
          # cache alongside the build ones.
          components: clippy
      # reth pulls C deps (libmdbx via bindgen, etc.) — same set the Dockerfile installs.
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev clang cmake build-essential zstd
      # arkiv-bindings' build.rs shells out to `forge build`, so Foundry must be on PATH.
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: taiki-e/install-action@nextest
      - uses: oras-project/setup-oras@v2

      # Deliberately no Swatinem/rust-cache here: a restored target dir would
      # defeat the point, and this is what produces the cache in the first place.
      - name: Build binaries
        id: bins
        run: |
          set -euo pipefail
          t0=$(date +%s)
          cargo build --workspace --locked --profile "$PROFILE"
          echo "seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"

      # Compiles the test binaries without running them. The cache is the
      # deliverable here; pr-checks is what actually runs the suite.
      - name: Build tests
        id: tests
        run: |
          set -euo pipefail
          t0=$(date +%s)
          cargo nextest run --workspace --locked --cargo-profile "$PROFILE" --no-run
          echo "seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"

      # Clippy checks are their own units: clippy-driver runs as
      # RUSTC_WORKSPACE_WRAPPER, so a workspace crate's clippy artifact has a
      # different fingerprint from its rustc one and `cargo build` above warms
      # nothing for it. Running it here puts those artifacts in the cache, and
      # pr-checks' clippy then only re-checks what the pull request touched.
      #
      # The invocation has to match pr-checks exactly — profile, `--no-deps`
      # and the `-D warnings` argument are all part of the fingerprint, and any
      # difference means the restored artifacts are ignored and the lane pays
      # full price anyway.
      #
      # Not a gate: this workflow's deliverable is the cache. A lint that only
      # main can fix must not stop the cache from being published, so the
      # status is recorded in the summary and the build carries on. pr-checks
      # is where clippy blocks.
      - name: Warm clippy
        id: clippy
        continue-on-error: true
        run: |
          set -euo pipefail
          t0=$(date +%s)
          status=0
          cargo clippy --workspace --locked --profile "$PROFILE" --no-deps \
            -- -D warnings 2>&1 | tee clippy.log || status=$?
          {
            echo "seconds=$(( $(date +%s) - t0 ))"
            echo "status=$status"
            echo "lints=$(grep -c '^error: ' clippy.log || true)"
          } >> "$GITHUB_OUTPUT"
          # clippy.log sits next to target/, not inside it, so packing is
          # unaffected — but leave nothing for a later glob to pick up.
          rm -f clippy.log

      # Drop the C intermediates jemalloc and rocksdb leave behind once their
      # .a archives exist — ~1200 files, ~174 MB, that nothing links against.
      #
      # Nothing else here is dead weight: deps/*.rmeta is what lets dependent
      # crates typecheck without recompiling, .fingerprint decides freshness,
      # and both copies of libjemalloc.a stay because the build script emits
      # rustc-link-search pointing at out/build/lib.
      - name: Prune C intermediates
        id: prune
        run: |
          set -euo pipefail
          before=$(du -sm target | cut -f1)
          count=$(find target -name '*.o' | wc -l)
          find target -name '*.o' -delete
          {
            echo "before=${before}"
            echo "after=$(du -sm target | cut -f1)"
            echo "removed=${count}"
          } >> "$GITHUB_OUTPUT"

      # `tar --zstd` compresses at level 3; level 10 with a 128 MB window is
      # ~21% smaller for a few extra seconds, and still unpacks with a plain
      # `tar --zstd -xf`. The name is fixed so consumers need no glob.
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          tar -I 'zstd -10 -T0 --long=27' -cf "$ARCHIVE" target
          echo "mb=$(( $(stat -c%s "$ARCHIVE") / 1024 / 1024 ))" >> "$GITHUB_OUTPUT"

      # Published as an OCI artifact rather than a Docker image layer: oras
      # stores the blob byte-for-byte, so the zstd tarball stays ~772 MB. An
      # image layer would be gzipped by the builder instead, which is both
      # slower and considerably larger on already-compressed input.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          oras login ghcr.io -u '${{ github.actor }}' --password-stdin <<< "$GH_TOKEN"
          oras push "$PACKAGE:$PROFILE" \
            --artifact-type "application/vnd.arkiv.build-cache.v1" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "network.arkiv.profile=$PROFILE" \
            --annotation "network.arkiv.built-at=$(date -u +%FT%TZ)" \
            "$ARCHIVE:application/vnd.arkiv.build-cache.v1.tar+zstd"

      # Moving a tag leaves the version it pointed at behind, untagged but still
      # occupying storage. Deleting exactly the untagged ones keeps one live
      # version per profile without either leg having to know about the other —
      # a version count would delete the sibling profile's cache.
      #
      # Not fatal if it fails: an uncollected version wastes space, whereas
      # failing here would mask a cache that published fine.
      - name: Drop superseded versions
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          owner: arkiv-network
          package-name: arkiv-build-cache
          package-type: container
          delete-only-untagged-versions: true
          # Keep the most recent untagged version for one cycle. Pushing the
          # tag moves it; a job that resolved the old digest a moment earlier
          # is still streaming ~772 MB, and deleting it immediately frees the
          # blobs underneath it and 404s that pull. Scoped to untagged versions,
          # so this never touches another profile's tag.
          min-versions-to-keep: 1

      - if: always()
        run: |
          {
            echo "## cold build ($PROFILE)"
            echo
            echo "| step | seconds |"
            echo "|---|---|"
            echo "| binaries | ${{ steps.bins.outputs.seconds }} |"
            echo "| tests | ${{ steps.tests.outputs.seconds }} |"
            echo "| clippy | ${{ steps.clippy.outputs.seconds }} |"
            echo
            echo "clippy exit ${{ steps.clippy.outputs.status }}, lints: ${{ steps.clippy.outputs.lints }}"
            echo
            echo "- target: ${{ steps.prune.outputs.before }}MB -> ${{ steps.prune.outputs.after }}MB (${{ steps.prune.outputs.removed }} object files pruned)"
            echo "- package: \`$PACKAGE:$PROFILE\` (${{ steps.pack.outputs.mb }}MB)"
          } >> "$GITHUB_STEP_SUMMARY"
