# Experiment: does packing the Cargo home alongside target/ beat packing
# target/ alone?
#
# cold-build's caches carry only the build tree — verified by unpacking one:
# 786 compiled dependency rlibs and not a single .crate archive. So a warm run
# still fetches the index, 784 .crate files and the git dependencies, then
# re-extracts them into registry/src.
#
# The extra layer here is 282 MB, of which 180 MB is the bare clones of reth
# and discv5 — the part an earlier "downloads cost 22s" measurement missed
# entirely, since that timed the sparse index and crates.io only.
#
# Unvalidated: nothing has restored this tag yet, so whether the layer pays for
# its own transfer is still an open question. Dispatch only until it does.
#
# Scoped deliberately: one profile (dev-fast), the test binaries only, one tag.
name: full-test-cache

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  PACKAGE: ghcr.io/arkiv-network/arkiv-build-cache
  TAG: full-test-cache
  PROFILE: dev-fast

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev clang cmake build-essential zstd
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: taiki-e/install-action@nextest
      - uses: oras-project/setup-oras@v2

      # No cache of any kind: this run is what fills one.
      - name: Build the test binaries
        id: build
        run: |
          set -euo pipefail
          t0=$(date +%s)
          cargo nextest run --workspace --locked --cargo-profile "$PROFILE" --no-run
          echo "seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"

      # Same prune as cold-build: the C intermediates jemalloc and rocksdb leave
      # behind once their .a archives exist, which nothing links against.
      - name: Prune C intermediates
        id: prune
        run: |
          set -euo pipefail
          before=$(du -sm target | cut -f1)
          count=$(find target -name '*.o' | wc -l)
          find target -name '*.o' -delete
          {
            echo "before=${before}"
            echo "after=$(du -sm target | cut -f1)"
            echo "removed=${count}"
          } >> "$GITHUB_OUTPUT"

      # Two archives rather than one, because they restore to different places:
      # target/ into the workspace, the registry into CARGO_HOME. A single tar
      # would drop `.cargo` inside the checkout, where cargo never looks.
      #
      # registry/src is the extracted form of registry/cache and is redundant on
      # disk, but shipping it is the point of the experiment: it is the
      # unpacking, not the download, that a target-only cache pays for.
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          tar -I 'zstd -10 -T0 --long=27' -cf target-cache.tar.zst target
          tar -I 'zstd -10 -T0 --long=27' -cf cargo-home.tar.zst \
            -C "$cargo_home" registry git
          {
            echo "target_mb=$(( $(stat -c%s target-cache.tar.zst) / 1024 / 1024 ))"
            echo "cargo_mb=$(( $(stat -c%s cargo-home.tar.zst) / 1024 / 1024 ))"
            echo "cargo_raw_mb=$(du -sm "$cargo_home/registry" "$cargo_home/git" | awk '{s+=$1} END {print s}')"
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          oras login ghcr.io -u '${{ github.actor }}' --password-stdin <<< "$GH_TOKEN"
          oras push "$PACKAGE:$TAG" \
            --artifact-type "application/vnd.arkiv.build-cache.v1" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "network.arkiv.profile=$PROFILE" \
            --annotation "network.arkiv.built-at=$(date -u +%FT%TZ)" \
            target-cache.tar.zst:application/vnd.arkiv.build-cache.v1.tar+zstd \
            cargo-home.tar.zst:application/vnd.arkiv.build-cache.v1.tar+zstd

      - name: Drop superseded versions
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          owner: arkiv-network
          package-name: arkiv-build-cache
          package-type: container
          delete-only-untagged-versions: true

      - if: always()
        run: |
          {
            echo "## full-test-cache ($PROFILE)"
            echo
            echo "- cold test build: ${{ steps.build.outputs.seconds }}s"
            echo "- target: ${{ steps.prune.outputs.before }}MB -> ${{ steps.prune.outputs.after }}MB (${{ steps.prune.outputs.removed }} object files pruned)"
            echo "- packed target: ${{ steps.pack.outputs.target_mb }}MB"
            echo "- packed cargo home: ${{ steps.pack.outputs.cargo_mb }}MB (${{ steps.pack.outputs.cargo_raw_mb }}MB raw)"
            echo "- package: \`$PACKAGE:$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
