# The checks lane: fmt, then tests, then clippy, on the same shared cache.
#
# Ordered cheapest-first so an obvious failure reports in seconds rather than
# after a test run.
#
# clippy is scoped with `--no-deps`: cargo runs clippy-driver as
# RUSTC_WORKSPACE_WRAPPER, so only workspace crates are linted and their
# dependencies are reused straight from the restored cache instead of being
# re-analysed. Without it clippy also lints every dependency, which is both
# slow and not actionable.
name: pr-checks

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo profile to build with"
        required: false
        default: "dev-fast"
        type: choice
        options: [dev-fast]
      tag:
        description: "Cache tag; defaults to the profile's own mirrored cache"
        required: false
        default: ""
        type: string
  # `workflow_dispatch` is not startable until this file reaches the default
  # branch, so pushes to the working branch are how to measure it by hand.
  # TEMPORARY: drop before merging.
  push:
    branches: [scx1332/ci-optimizations]
  pull_request:

# Gates pull requests. Superseded runs are pointless once the head moves,
# so a new push cancels the one in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      # The cache tag mirrors the profile: cold-build publishes one per profile
      # from the same tree, so dispatching dev-fast measures the same lane
      # against the cheaper optimisation level.
      PROFILE: ${{ inputs.profile || 'dev-fast' }}
      PACKAGE: ghcr.io/arkiv-network/arkiv-build-cache:${{ inputs.tag || inputs.profile || 'dev-fast' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev clang cmake build-essential zstd
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: taiki-e/install-action@nextest
      - uses: oras-project/setup-oras@v2

      # fmt needs no build tree, so it runs before the cache is even pulled.
      - name: fmt
        run: cargo fmt --all --check

      - name: Restore the shared cache
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          oras login ghcr.io -u '${{ github.actor }}' --password-stdin <<< "$GH_TOKEN"
          t0=$(date +%s)
          oras pull "$PACKAGE"
          tar --zstd -xpf target-cache.tar.zst
          # Only full-test-cache ships one. Restoring it skips both the
          # crates.io fetch and the unpack into registry/src.
          if [ -f cargo-home.tar.zst ]; then
            tar --zstd -xpf cargo-home.tar.zst -C "${CARGO_HOME:-$HOME/.cargo}"
            echo "cargo_home=yes" >> "$GITHUB_OUTPUT"
          else
            echo "cargo_home=no" >> "$GITHUB_OUTPUT"
          fi
          echo "seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"

      - name: tests
        id: tests
        run: |
          set -euo pipefail
          t0=$(date +%s)
          cargo nextest run --workspace --locked --cargo-profile "$PROFILE"
          echo "seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"

      # Blocking. It runs last and nothing depends on it, so a lint failure
      # costs nothing already done: fmt and the tests have reported, and the
      # binaries come out of pr-artifact regardless.
      - name: clippy
        id: clippy
        run: |
          # pipefail matters: without it `tee` would mask clippy's exit status.
          set -euo pipefail
          t0=$(date +%s)
          # Clippy exits 0 on lint warnings, so `-D warnings` is what makes
          # this a gate rather than a report.
          status=0
          cargo clippy --workspace --locked --profile "$PROFILE" --no-deps \
            -- -D warnings 2>&1 | tee clippy.log || status=$?
          {
            echo "seconds=$(( $(date +%s) - t0 ))"
            echo "lints=$(grep -c '^error: ' clippy.log || true)"
          } >> "$GITHUB_OUTPUT"
          exit $status

      - if: always()
        run: |
          {
            echo "## checks"
            echo
            echo "| step | seconds |"
            echo "|---|---|"
            echo "| restore | ${{ steps.restore.outputs.seconds }} |"
            echo "| tests | ${{ steps.tests.outputs.seconds }} |"
            echo "| clippy | ${{ steps.clippy.outputs.seconds }} |"
            echo
            echo "clippy lints: ${{ steps.clippy.outputs.lints }}"
            echo
            echo "cache \`${PACKAGE##*:}\`, profile \`$PROFILE\`, cargo home restored: ${{ steps.restore.outputs.cargo_home }}"
          } >> "$GITHUB_STEP_SUMMARY"
