# The checks lane: fmt, then tests, then clippy, on the same shared cache.
#
# Ordered cheapest-first so an obvious failure reports in seconds rather than
# after a test run.
#
# clippy is scoped with `--no-deps`: cargo runs clippy-driver as
# RUSTC_WORKSPACE_WRAPPER, so only workspace crates are linted and their
# dependencies are reused straight from the restored cache instead of being
# re-analysed. Without it clippy also lints every dependency, which is both
# slow and not actionable.
name: pr-checks

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Build cache to restore"
        required: false
        default: "ghcr.io/arkiv-network/arkiv-build-cache:tests-release-fast-5e838b2953c9"
  push:
    branches: [scx1332/ci-optimizations]
    paths: [".github/workflows/pr-checks.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      PROFILE: release-fast
      PACKAGE: ${{ inputs.package || 'ghcr.io/arkiv-network/arkiv-build-cache:tests-release-fast-5e838b2953c9' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev clang cmake build-essential zstd
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: taiki-e/install-action@nextest
      - uses: oras-project/setup-oras@v2

      # fmt needs no build tree, so it runs before the cache is even pulled.
      - name: fmt
        run: cargo fmt --all --check

      - name: Restore the shared cache
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          oras login ghcr.io -u '${{ github.actor }}' --password-stdin <<< "$GH_TOKEN"
          t0=$(date +%s)
          oras pull "$PACKAGE"
          tar --zstd -xpf target-tests-*.tar.zst
          echo "seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"

      - name: tests
        id: tests
        run: |
          set -euo pipefail
          t0=$(date +%s)
          cargo nextest run --workspace --locked --cargo-profile "$PROFILE"
          echo "seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"

      # Not blocking yet: the workspace has never been linted in CI, so let
      # this report what it finds before it gates anything. Drop
      # continue-on-error (and keep -D warnings) to make it a gate.
      - name: clippy
        id: clippy
        continue-on-error: true
        run: |
          set -euo pipefail
          t0=$(date +%s)
          cargo clippy --workspace --locked --profile "$PROFILE" --no-deps 2>&1 | tee clippy.log
          echo "seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
          echo "warnings=$(grep -c '^warning' clippy.log || true)" >> "$GITHUB_OUTPUT"

      - if: always()
        run: |
          {
            echo "## checks"
            echo
            echo "| step | seconds |"
            echo "|---|---|"
            echo "| restore | ${{ steps.restore.outputs.seconds }} |"
            echo "| tests | ${{ steps.tests.outputs.seconds }} |"
            echo "| clippy | ${{ steps.clippy.outputs.seconds }} |"
            echo
            echo "clippy warnings: ${{ steps.clippy.outputs.warnings }} (non-blocking)"
          } >> "$GITHUB_STEP_SUMMARY"
