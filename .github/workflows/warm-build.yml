# Restores a build tree produced by `cold-build` and rebuilds on top of it,
# to answer one question: how much of a cold build does a restored cache
# actually save?
#
# The cache is only reusable in CI. Cargo's fingerprints and the .d files
# record absolute paths, and CI builds under /home/runner/work/arkiv/arkiv,
# so a restore on a developer machine at a different path recompiles anyway.
name: warm-build

on:
  push:
    branches: [scx1332/ci-optimizations]
  workflow_dispatch:
    inputs:
      package:
        description: "OCI package holding the build cache"
        required: false
        default: "ghcr.io/arkiv-network/arkiv-build-cache:release-fast-5fbfe2aadc2a"
      profile:
        description: "Cargo profile"
        required: false
        default: "release-fast"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Reading the build-cache package off GHCR.
      packages: read
    env:
      PROFILE: ${{ inputs.profile || 'release-fast' }}
      PACKAGE: ${{ inputs.package || 'ghcr.io/arkiv-network/arkiv-build-cache:release-fast-5fbfe2aadc2a' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev clang cmake build-essential zstd mold
      - uses: foundry-rs/foundry-toolchain@v1

      # Deliberately no Swatinem/rust-cache: the restored tree is the only
      # cache under test.
      - uses: oras-project/setup-oras@v2

      - name: Pull and restore the build tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          oras login ghcr.io -u '${{ github.actor }}' --password-stdin <<< "$GH_TOKEN"
          t0=$(date +%s)
          oras pull "$PACKAGE"
          echo "pulled in $(( $(date +%s) - t0 ))s"
          t1=$(date +%s)
          # The tarball holds target/<profile>/, so unpack from the repo root.
          tar --zstd -xpf target-*.tar.zst
          echo "restored in $(( $(date +%s) - t1 ))s: $(du -sh target | cut -f1)"

      # `-v` isn't needed: cargo prints one "Compiling" line per unit it
      # actually rebuilds, so counting them shows what the cache saved.
      - name: Rebuild on the restored tree
        id: warm
        run: |
          set -euo pipefail
          mold --version | head -1
          t0=$(date +%s)
          # `mold -run` intercepts the linker exec via LD_PRELOAD instead of
          # going through RUSTFLAGS, so cargo's fingerprints are untouched and
          # the restored cache stays valid. Only the final binary link changes.
          mold -run cargo build --workspace --locked --profile "$PROFILE" 2>&1 \
            | while IFS= read -r line; do printf '%s %s\n' "$(date +%s)" "$line"; done \
            | tee build.log
          echo "seconds=$(( $(date +%s) - t0 ))" >> "$GITHUB_OUTPUT"
          echo "recompiled=$(grep -c ' Compiling ' build.log || true)" >> "$GITHUB_OUTPUT"
          # The tail is codegen + link of the two binaries: what mold can affect.
          lc=$(grep ' Compiling ' build.log | tail -1 | cut -d' ' -f1 || echo "")
          fin=$(grep ' Finished ' build.log | tail -1 | cut -d' ' -f1 || echo "")
          if [ -n "$lc" ] && [ -n "$fin" ]; then
            echo "tail=$(( fin - lc ))" >> "$GITHUB_OUTPUT"
          fi

      - if: always()
        env:
          COLD_SECONDS: "1490"
        run: |
          warm=${{ steps.warm.outputs.seconds }}
          {
            echo "## warm build ($PROFILE), cache from \`$PACKAGE\`"
            echo
            echo "| | seconds |"
            echo "|---|---|"
            echo "| cold (no cache) | $COLD_SECONDS |"
            echo "| warm (restored) | ${warm:-n/a} |"
            echo
            echo "- crates recompiled: ${{ steps.warm.outputs.recompiled }}"
            echo "- codegen+link tail: ${{ steps.warm.outputs.tail }}s (was 303s with GNU ld)"
            if [ -n "${warm:-}" ] && [ "$warm" -gt 0 ]; then
              echo "- saved: $(( COLD_SECONDS - warm ))s ($(( (COLD_SECONDS - warm) * 100 / COLD_SECONDS ))%)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
