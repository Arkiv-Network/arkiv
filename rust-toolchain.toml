# The single source of truth for the toolchain, in CI as well as locally.
# GitHub's runner images ship rustup, and rustup installs the channel and the
# components named here on the first cargo invocation, so CI jobs need no
# toolchain-setup step of their own. The one exception is `rust.yml`'s udeps
# job, which needs a nightly rustc this file deliberately does not pin.
[toolchain]
channel = "1.97"
components = ["rustfmt", "clippy"]
